<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your shopping cart — review items and checkout via WhatsApp at Kanto Keepsakes.">
  <title>Cart — Kanto Keepsakes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="../index.html" class="logo-link">
        <img src="../images/Kanto-Keepsakes-logo.webp" alt="Kanto Keepsakes" class="logo">
      </a>
      <button class="hamburger" aria-label="Open menu" aria-expanded="false">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
    <div class="nav-backdrop"></div>
    <nav class="nav-overlay" aria-label="Main navigation">
      <ul class="nav-list">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="accessories.html" class="nav-link">TCG Accessories</a></li>
        <li><a href="preorder.html" class="nav-link">Preorder</a></li>
        <li><a href="cart.html" class="nav-link nav-cart">Cart <span class="cart-count" aria-label="items in cart">0</span></a></li>
      </ul>
    </nav>
  </header>

  <main class="main-content container">
    <div class="page-header">
      <h1>Shopping Cart</h1>
    </div>

    <div class="cart-container">
      <div class="cart-empty" style="display: none;">
        <p>Your cart is empty.</p>
        <a href="../index.html" class="btn btn-primary">Continue Shopping</a>
      </div>

      <div class="cart-items"></div>

      <div class="cart-summary" style="display: none;">
        <div class="cart-summary-row">
          <span>Total</span>
          <span class="cart-total-price">$0.00</span>
        </div>
        <button class="btn btn-primary btn-full btn-checkout">
          Checkout via WhatsApp
        </button>
        <button class="btn btn-secondary btn-full btn-clear-cart">
          Clear Cart
        </button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Kanto Keepsakes. All rights reserved.</p>
  </footer>

  <script src="../js/app.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
